<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panorama</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #000;
      height: 100vh;
      width: 100vw;
      cursor: grab;
    }
    body:active { cursor: grabbing; }

    .bg {
      position: relative;
      width: 166.67vw;
      height: 100vh;
      background: url('https://i.postimg.cc/G2hvyCr5/ezgif-com-reverse.gif') no-repeat center/100% 100%;
      will-change: transform;
      transform: translateX(0vw);
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <script>
    (function() {
      const bg = document.getElementById('bg');
      const maxOffset = 66.67; // in vw units (166.67 - 100)

      let currentX = 0;
      let targetX = 0;

      function update() {
        // Ease towards target for smooth tracking
        currentX += (targetX - currentX) * 0.12;

        // Optional: add a tiny deadzone to prevent jitter at exact edges
        if (Math.abs(targetX - currentX) < 0.001) {
          currentX = targetX;
        }

        bg.style.transform = `translateX(${-currentX}vw)`;
        requestAnimationFrame(update);
      }

      // --- Mouse movement ---
      document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth; // 0 to 1
        targetX = maxOffset * x;
      });

      // --- Scroll wheel support (for "scroll for hiding part") ---
      document.addEventListener('wheel', (e) => {
        // deltaY positive = scroll down, we map it to moving right
        const delta = e.deltaY * 0.15;
        targetX = Math.max(0, Math.min(maxOffset, targetX + delta));
        e.preventDefault();
      }, { passive: false });

      // --- Touch support for mobile ---
      let touchStartX = 0;
      document.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        const touchX = e.touches[0].clientX;
        const diff = touchX - touchStartX;
        // Map touch movement to targetX
        const percent = diff / window.innerWidth;
        targetX = Math.max(0, Math.min(maxOffset, targetX + percent * maxOffset));
        touchStartX = touchX;
      }, { passive: true });

      // Start the animation loop
      update();
    })();
  </script>
</body>
</html>
